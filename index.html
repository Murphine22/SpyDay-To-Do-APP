<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.1/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Digital+7&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-200">
    <div class="container mx-auto px-4 py-8 max-w-4xl relative">
        <!-- Add digital clock -->
        <div class="digital-clock glass-effect mb-6 p-4 rounded-xl text-center">
            <div id="clockDisplay" class="text-4xl font-digital text-blue-500 dark:text-blue-400"></div>
            <div id="dateDisplay" class="text-sm text-gray-600 dark:text-gray-400"></div>
        </div>

        <!-- Header with glass effect -->
        <header class="glass-effect flex justify-between items-center mb-8 p-6 rounded-2xl animate__animated animate__fadeIn">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent">
                Task Master
            </h1>
            <button id="darkModeToggle" 
                class="p-3 rounded-xl bg-gray-200 dark:bg-gray-700 hover:scale-110 transition-all duration-300">
                <svg class="w-6 h-6 text-gray-800 dark:text-yellow-300 sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
                <svg class="w-6 h-6 text-gray-800 dark:text-yellow-300 moon-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                </svg>
            </button>
        </header>

        <!-- Task Input with enhanced styling -->
        <div class="mb-8 animate__animated animate__fadeInDown">
            <form id="taskForm" class="space-y-4 glass-effect p-6 rounded-2xl">
                <input type="text" id="taskInput" placeholder="Add a new task..." 
                    class="w-full p-4 rounded-lg border-2 border-gray-200 dark:border-gray-700 
                    bg-white dark:bg-gray-800 text-gray-800 dark:text-white focus:ring-2 
                    focus:ring-blue-500 transition-all">
                
                <div class="flex space-x-4">
                    <select id="taskPriority" class="p-4 rounded-lg border-2 border-gray-200 
                        dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 
                        dark:text-white">
                        <option value="low">Low Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    
                    <select id="taskCategory" class="p-4 rounded-lg border-2 border-gray-200 
                        dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 
                        dark:text-white">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>

                    <input type="datetime-local" id="taskDate" 
                        class="p-4 rounded-lg border-2 border-gray-200 dark:border-gray-700 
                        bg-white dark:bg-gray-800 text-gray-800 dark:text-white">
                </div>

                <button type="submit" 
                    class="w-full p-4 bg-blue-500 text-white rounded-lg hover:bg-blue-600 
                    transition-colors duration-200">
                    Add Task
                </button>
            </form>
        </div>

        <!-- Updated Filter buttons -->
        <div class="mb-8 flex space-x-4 animate__animated animate__fadeIn overflow-x-auto pb-2">
            <button class="filter-btn active" data-filter="all">
                <span class="flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                    All
                </span>
            </button>
            <button class="filter-btn" data-filter="daily">Daily</button>
            <button class="filter-btn" data-filter="weekly">Weekly</button>
            <button class="filter-btn" data-filter="monthly">Monthly</button>
            <button class="filter-btn" data-filter="yearly">Yearly</button>
        </div>

        <!-- Task List with enhanced animations -->
        <div id="taskList" class="space-y-4 relative">
            <!-- Tasks will be inserted here dynamically -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
